name: CI and release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Compile release binary
        run: cargo build --locked --release

      - name: Package release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/jarvis-rs.exe dist/jarvis-rs.exe
          Compress-Archive -Path dist/jarvis-rs.exe -DestinationPath jarvis-rs-windows-x86_64.zip
          $hash = (Get-FileHash jarvis-rs-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  jarvis-rs-windows-x86_64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload release files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-files
          path: |
            jarvis-rs-windows-x86_64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4.3.0
        with:
          name: release-files

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          short_sha="${RELEASE_SHA:0:7}"
          tag="build-${RUN_NUMBER}-${short_sha}"
          gh release create "$tag" \
            jarvis-rs-windows-x86_64.zip \
            SHA256SUMS.txt \
            --repo "$REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Jarvis build ${RUN_NUMBER} (${short_sha})" \
            --generate-notes
